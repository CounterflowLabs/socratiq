services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: socratiq
      POSTGRES_PASSWORD: socratiq
      POSTGRES_DB: socratiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socratiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://socratiq:socratiq@db:5432/socratiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CODEX_HOME=/codex-home
      # OpenTelemetry — empty by default; set via `docker compose --profile apm`
      # which also brings up the otel-lgtm service below.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=socratiq-backend
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=${ENVIRONMENT:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codexhome:/codex-home

  worker:
    build: ./backend
    # Listens on both queues. Concurrency 4 by default; for local-only
    # setups (Ollama) the in-process semaphore in CourseGenerator clamps
    # chunk-level fanout to 1, so the worker concurrency only matters for
    # task-level parallelism (eg. lesson regeneration alongside ingest).
    command: celery -A app.worker.celery_app worker --loglevel=info -Q embed_queue,generate_queue,celery --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://socratiq:socratiq@db:5432/socratiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CODEX_HOME=/codex-home
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=socratiq-worker
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=${ENVIRONMENT:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codexhome:/codex-home

  # Grafana LGTM stack in a single container (Loki + Grafana + Tempo + Mimir).
  # Brought up only with `docker compose --profile apm up`. When active, set:
  #   export OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
  # in your shell (or .env) before running `docker compose up` so the backend
  # and worker export to it. Otherwise OTel stays disabled (no-op).
  #
  # Grafana UI:           http://localhost:3001
  # OTLP gRPC ingest:     :4317 (in-network), exposed on host :4317
  # OTLP HTTP ingest:     :4318
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["apm"]
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - otel-lgtm-data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  pgdata:
  redisdata:
  codexhome:
  otel-lgtm-data:
