services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: socratiq
      POSTGRES_PASSWORD: socratiq
      POSTGRES_DB: socratiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socratiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://socratiq:socratiq@db:5432/socratiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CODEX_HOME=/codex-home
      # Needed to decrypt model_configs.api_key_encrypted. Supplied by
      # env_file above; also passed through explicitly (interpolated from the
      # host env/.env — no secret hardcoded) so the dependency is visible and
      # survives even if env_file is dropped.
      - LLM_ENCRYPTION_KEY=${LLM_ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codexhome:/codex-home

  worker:
    build: ./backend
    # Listens on both queues. Concurrency 4 by default; for local-only
    # setups (Ollama) the in-process semaphore in CourseGenerator clamps
    # chunk-level fanout to 1, so the worker concurrency only matters for
    # task-level parallelism (eg. lesson regeneration alongside ingest).
    command: celery -A app.worker.celery_app worker --loglevel=info -Q embed_queue,generate_queue,celery --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://socratiq:socratiq@db:5432/socratiq
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CODEX_HOME=/codex-home
      # Needed to decrypt model_configs.api_key_encrypted. Supplied by
      # env_file above; also passed through explicitly (interpolated from the
      # host env/.env — no secret hardcoded) so the dependency is visible and
      # survives even if env_file is dropped.
      - LLM_ENCRYPTION_KEY=${LLM_ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codexhome:/codex-home

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  pgdata:
  redisdata:
  codexhome:
